<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MessSkip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root{
  --bg:#E8EBE9;--paper:#FFFFFF;--paper-2:#F2F4F2;--ink:#1A2421;--muted:#5A6762;--line:#D3D9D5;
  --bf:#D9960F;--ln:#2E7D4F;--sn:#8A5A2B;--dn:#33407A;--grey:#9AA7A1;
  --skip-bg:#FFF1C7;--skip-line:#D9960F;--skip-ink:#6E4B00;
  --ok:#2E7D4F;--ok-bg:#DFF0E5;--no:#A3301D;--no-bg:#F8E1DB;--focus:#2E7D4F;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101614;--paper:#18211E;--paper-2:#1F2A26;--ink:#E6ECE9;--muted:#9BA8A2;--line:#2D3A35;
    --bf:#E8A92A;--ln:#4FA872;--sn:#B07A45;--dn:#5D6BB0;--grey:#5E6B65;
    --skip-bg:#3A2E0E;--skip-line:#E8A92A;--skip-ink:#F3C966;
    --ok:#6CCB94;--ok-bg:#173126;--no:#F2917D;--no-bg:#3B1D17;--focus:#6CCB94;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101614;--paper:#18211E;--paper-2:#1F2A26;--ink:#E6ECE9;--muted:#9BA8A2;--line:#2D3A35;
  --bf:#E8A92A;--ln:#4FA872;--sn:#B07A45;--dn:#5D6BB0;--grey:#5E6B65;
  --skip-bg:#3A2E0E;--skip-line:#E8A92A;--skip-ink:#F3C966;
  --ok:#6CCB94;--ok-bg:#173126;--no:#F2917D;--no-bg:#3B1D17;--focus:#6CCB94;color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--paper);border-bottom:1px solid var(--line)}
.top-inner{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.brand{font-weight:800;font-size:1.25rem;letter-spacing:-.02em;line-height:1.1}
.brand small{display:block;font-weight:500;font-size:.78rem;color:var(--muted);letter-spacing:0}
.viewing{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.themebtn{border:1px solid var(--line);background:var(--paper-2);border-radius:10px;padding:6px 10px;font-weight:600;font-size:.85rem;cursor:pointer;color:var(--ink);white-space:nowrap}
.roles{display:flex;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:3px;max-width:100%;overflow-x:auto}
.roles button{border:0;background:transparent;font-weight:600;font-size:.85rem;padding:6px 11px;border-radius:7px;color:var(--muted);cursor:pointer;white-space:nowrap}
.roles button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 0 0 1px var(--line)}

main{margin:0 auto;padding:18px 16px 110px}
main.phone{max-width:460px}
main.wide{max-width:1000px}
h1,h2,h3{letter-spacing:-.02em;line-height:1.15}
h1{font-size:clamp(1.5rem,4.4vw,2.2rem);font-weight:800;margin:0 0 8px}
h2{font-size:1.2rem;font-weight:700;margin:0 0 6px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
section{margin-bottom:30px}

/* Pass */
.ticket{--c:var(--ln);position:relative;background:var(--paper);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.ticket.m-B{--c:var(--bf)}.ticket.m-L{--c:var(--ln)}.ticket.m-S{--c:var(--sn)}.ticket.m-D{--c:var(--dn)}
.t-head{background:var(--c);color:#fff;padding:16px 18px 18px;position:relative}
.t-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.88rem;font-weight:600}
.clock{font-variant-numeric:tabular-nums;font-weight:700}
.t-meal{font-size:3rem;font-weight:800;letter-spacing:-.035em;line-height:1;margin:14px 0 4px}
.t-when{font-size:.95rem}
.band{height:12px;background:repeating-linear-gradient(115deg,var(--c) 0 14px,color-mix(in srgb,var(--c) 55%,#fff) 14px 28px);background-size:200% 100%;animation:slide 2.4s linear infinite}
@keyframes slide{to{background-position:-60px 0}}
.t-body{position:relative;padding:20px 18px;display:flex;gap:18px;align-items:center;border-top:2px dashed var(--line)}
.t-body::before,.t-body::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.t-body::before{left:-11px}.t-body::after{right:-11px}
.qr{background:#fff;padding:8px;border-radius:10px;border:1px solid #D3D9D5;width:148px;height:148px;display:grid;place-items:center;flex:none;color:#1A2421;font-weight:700}
.qr img,.qr canvas{display:block}
.who .name{font-size:1.25rem;font-weight:800;line-height:1.15}
.who div{color:var(--muted);font-size:.95rem}
.t-foot{padding:0 18px 16px;font-size:.84rem;color:var(--muted)}
.ticket.skipped .t-head{background:#7C8681}
.ticket.skipped .band{background:#B5BCB8;animation:none}
.ticket.skipped .qr{opacity:.2}
.stamp{position:absolute;right:16px;top:52px;transform:rotate(-8deg);border:3px solid #fff;color:#fff;font-weight:800;font-size:1.05rem;padding:2px 10px;border-radius:6px}
.note-box{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:.92rem}
.note-box.no{background:var(--no-bg)}
.note-box.soft{background:var(--paper);border:1px solid var(--line)}
.daylist{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.daylist li{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:.94rem}
.st{font-weight:600}
.st.eat{color:var(--ok)}.st.skip{color:var(--skip-ink)}.st.done{color:var(--muted);font-weight:500}

/* Meals board */
.day{padding:14px 0;border-top:1px solid var(--line)}
.day-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.day-h strong{font-size:1rem}
.day-h .meta{font-size:.82rem;color:var(--muted)}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbtn{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 11px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:76px}
.mbtn .mn{font-size:.78rem;font-weight:700;color:var(--muted)}
.mbtn .dish{font-size:.9rem;line-height:1.25}
.mbtn .st{font-size:.8rem;margin-top:auto}
.mbtn.skip{background:var(--skip-bg);border-color:var(--skip-line)}
.mbtn.locked{cursor:not-allowed;opacity:.55}
.rules{list-style:none;margin:10px 0 0;padding:0}
.rules li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type="text"],input[type="number"]{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:42px}
input[type="text"]{flex:1 1 170px;min-width:0;text-transform:uppercase}
input[type="number"]{width:96px;text-align:right}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;min-height:42px}
.btn.quiet{background:transparent;color:var(--ink);border-color:var(--line);font-weight:600}
.btn.tiny{min-height:32px;padding:4px 10px;font-size:.84rem}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px;font-size:.88rem}
.big{font-size:3.4rem;font-weight:800;letter-spacing:-.04em;line-height:1}
.aside{background:var(--paper-2);border-radius:12px;padding:12px 14px;font-size:.92rem}
.switch{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.toggle{position:relative;width:48px;height:28px;border-radius:999px;border:0;background:var(--grey);cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle[aria-checked="true"]{background:var(--ok)}
.toggle[aria-checked="true"]::after{transform:translateX(20px)}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:none;padding:9px 4px 11px;font-weight:600;font-size:.84rem;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs .ic{font-size:1.2rem;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] .lbl{box-shadow:0 2px 0 var(--ink)}

/* Manager */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:6px 12px;font-size:.88rem;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tablewrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:14px}
table.cook{width:100%;border-collapse:collapse;min-width:640px;font-size:.93rem}
table.cook th,table.cook td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.cook tr:last-child td{border-bottom:0}
table.cook th{font-size:.8rem;color:var(--muted);font-weight:600}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
.eatn{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.mealdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:1px}
.order{color:var(--muted);font-size:.88rem}
.status{display:inline-block;border-radius:7px;padding:2px 9px;font-size:.8rem;font-weight:700;margin-right:6px}
.status.final{background:var(--ok-bg);color:var(--ok)}
.status.open{background:var(--skip-bg);color:var(--skip-ink)}
table.glance{width:100%;border-collapse:collapse;min-width:520px;font-size:.9rem}
table.glance th,table.glance td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.glance th:first-child,table.glance td:first-child{text-align:left}
table.glance th{color:var(--muted);font-weight:600;font-size:.8rem}
table.glance tr:last-child td{border-bottom:0}
table.glance td.low{background:var(--skip-bg);color:var(--skip-ink);font-weight:700}
.doorhead{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
.doorhead .n{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.result{margin-top:14px;border-radius:14px;padding:16px 18px;border-left:6px solid var(--line);background:var(--paper)}
.result.ok{border-color:var(--ok);background:var(--ok-bg)}
.result.no{border-color:var(--no);background:var(--no-bg)}
.result.warn{border-color:var(--skip-line);background:var(--skip-bg)}
.result strong{display:block;font-size:1.4rem;letter-spacing:-.02em}
.log{list-style:none;margin:12px 0 0;padding:0}
.log li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.r-ok{color:var(--ok);font-weight:600}.r-no{color:var(--no);font-weight:600}.r-warn{color:var(--skip-ink);font-weight:600}
/* Scanner */
.viewfinder{position:relative;background:#0E1412;border-radius:18px;aspect-ratio:4/3;overflow:hidden;color:#E6ECE9;display:grid;place-items:center;transition:box-shadow .2s}
.viewfinder video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.viewfinder .corners{position:absolute;inset:16%;pointer-events:none}
.viewfinder .corners i{position:absolute;width:34px;height:34px;border-color:#fff;border-style:solid;opacity:.9}
.viewfinder .corners i:nth-child(1){top:0;left:0;border-width:4px 0 0 4px;border-radius:10px 0 0 0}
.viewfinder .corners i:nth-child(2){top:0;right:0;border-width:4px 4px 0 0;border-radius:0 10px 0 0}
.viewfinder .corners i:nth-child(3){bottom:0;left:0;border-width:0 0 4px 4px;border-radius:0 0 0 10px}
.viewfinder .corners i:nth-child(4){bottom:0;right:0;border-width:0 4px 4px 0;border-radius:0 0 10px 0}
.viewfinder .line{position:absolute;left:16%;right:16%;top:16%;height:2px;background:#6CCB94;box-shadow:0 0 12px #6CCB94;animation:scanline 2s ease-in-out infinite alternate}
@keyframes scanline{to{top:84%}}
.viewfinder .msg{position:relative;z-index:2;text-align:center;padding:0 24px;font-size:.95rem;max-width:30ch}
.viewfinder .msg .btn{margin-top:12px;background:#fff;color:#1A2421;border-color:#fff}
.viewfinder .mock{position:absolute;inset:22% 26%;background:#fff;border-radius:10px;display:grid;grid-template-rows:auto 1fr;overflow:hidden;opacity:.92}
.viewfinder .mock b{display:block;background:#2E7D4F;color:#fff;font-size:.8rem;padding:5px 8px}
.viewfinder .mock span{display:block;margin:8px auto;width:56%;aspect-ratio:1;background:
  repeating-linear-gradient(90deg,#1A2421 0 6px,transparent 6px 12px),repeating-linear-gradient(0deg,#1A2421 0 6px,#fff 6px 12px);background-blend-mode:multiply;border-radius:3px}
.viewfinder .tag{position:absolute;left:12px;top:12px;z-index:3;background:rgba(0,0,0,.55);color:#fff;font-size:.78rem;font-weight:600;padding:4px 9px;border-radius:7px}
.viewfinder .stop{position:absolute;right:12px;top:12px;z-index:3;background:rgba(0,0,0,.55);color:#fff;border:0;font-size:.8rem;font-weight:600;padding:5px 10px;border-radius:7px;cursor:pointer}
.viewfinder.flash-ok{box-shadow:0 0 0 5px var(--ok)}
.viewfinder.flash-no{box-shadow:0 0 0 5px var(--no)}
.viewfinder.reading .line{animation-duration:.5s}
details.manual{margin-top:14px}
details.manual summary{cursor:pointer;font-weight:600}
.leftrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.leftrow .lbl{flex:1 1 200px}
.split{display:grid;gap:28px;grid-template-columns:1fr}
@media (min-width:860px){.split{grid-template-columns:1.2fr 1fr}}

/* GSec */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px 24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;margin-bottom:30px}
.stats .v{font-size:1.9rem;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.stats .l{font-size:.86rem;color:var(--muted)}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:44px 1fr 52px;gap:10px;align-items:center;font-size:.9rem}
.track{height:20px;background:var(--paper-2);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--grey);border-radius:5px}
.bar.hot .fill{background:var(--bf)}
.bar.hot>span:first-child{font-weight:700}
.pct{text-align:right;font-variant-numeric:tabular-nums}
.pair{display:grid;grid-template-columns:44px 1fr 60px;gap:4px 10px;align-items:center;font-size:.88rem;padding:4px 0}
.pair .track{height:12px}
.pair .fill.before{background:var(--grey)}
.pair .fill.now{background:var(--ok)}
.legend{display:flex;gap:16px;font-size:.84rem;color:var(--muted);margin:6px 0 10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ranked{list-style:none;margin:0;padding:0;counter-reset:r}
.ranked li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.ranked li::before{counter-increment:r;content:counter(r);color:var(--muted);font-weight:700}
.ranked .dish{color:var(--muted);font-size:.88rem;display:block}
table.data{width:100%;border-collapse:collapse;font-size:.92rem;min-width:340px}
table.data th,table.data td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data th{color:var(--muted);font-weight:600;font-size:.82rem}
.letter{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;max-width:68ch;white-space:pre-line}
details.about{border-top:1px solid var(--line);padding-top:14px;margin-top:8px}
details.about summary{cursor:pointer;font-weight:600;color:var(--muted)}
details.about li{margin:5px 0;color:var(--muted);font-size:.9rem}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:.9rem;max-width:min(92vw,440px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.band{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">MessSkip<small>Demo Hall mess, 700 boarders</small></div>
    <div class="viewing"><button type="button" class="themebtn" id="theme" aria-label="Switch to dark mode">🌙 Dark</button><span>Demo: viewing as</span>
      <div class="roles" role="group" aria-label="Viewing as">
        <button type="button" data-role="student">Student</button>
        <button type="button" data-role="manager">Mess staff</button>
        <button type="button" data-role="gsec">GSec and auditor</button>
      </div>
    </div>
  </div>
</header>
<main id="app"></main>
<nav class="tabs" id="tabs"><div class="in" id="tabs-in"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const BOARDERS = 700;
const ME = { name:'Aarav Mehta', first:'Aarav', roll:'22ME30041', room:'B-214' };
const RATE_PER_MEAL = 25;
const MEALS = [
  { k:'B', name:'Breakfast', start:'06:45', end:'09:00' },
  { k:'L', name:'Lunch', start:'11:45', end:'14:30' },
  { k:'S', name:'Snacks', start:'17:00', end:'18:30' },
  { k:'D', name:'Dinner', start:'19:15', end:'21:15' }
];
const MEAL_VAR = ['--bf','--ln','--sn','--dn'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW_LONG = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MON_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MENU = {
  0:['Chole bhature','Veg biryani, raita','Samosa, chai','Paneer butter masala, roti'],
  1:['Aloo paratha, curd','Rajma chawal','Bread pakora, chai','Mix veg, dal, roti'],
  2:['Poha','Kadhi chawal','Biscuits, chai','Lauki, dal, rice'],
  3:['Idli, sambar','Chole, rice','Pav bhaji','Egg curry or paneer, roti'],
  4:['Upma, banana','Dal makhani, rice','Maggi, chai','Aloo gobi, roti, kheer'],
  5:['Puri sabzi','Veg pulao, dal','Bhel puri','Chicken or paneer curry, rice'],
  6:['Bread, butter, egg','Khichdi, papad','Chai, rusk','Tinda, dal, roti']
};
// Simulated skip rates (Sun..Sat × breakfast, lunch, snacks, dinner), shaped by interviews:
// Saturday and Tuesday are the low-turnout days.
const RATES = [[.22,.18,.20,.15],[.12,.10,.15,.09],[.25,.30,.22,.34],[.12,.11,.14,.10],[.13,.10,.15,.09],[.14,.12,.16,.11],[.30,.38,.28,.46]];
const QTY = {
  B:[['Atta and bread',0.06,'kg'],['Potatoes and veg',0.08,'kg'],['Milk',0.15,'L']],
  L:[['Rice',0.12,'kg'],['Dal',0.05,'kg'],['Vegetables',0.15,'kg'],['Atta',0.06,'kg']],
  S:[['Snack ingredients',0.07,'kg'],['Milk for chai',0.08,'L']],
  D:[['Rice',0.08,'kg'],['Dal',0.05,'kg'],['Vegetables',0.15,'kg'],['Atta',0.10,'kg']]
};
const HALL_ROLLS = new Set([ME.roll,'22CS10077','21EE10023','20AE10045','23MA20011']);
const SAMPLES = [
  { roll: ME.roll, label:'Aarav' },
  { roll:'22CS10077', label:'Someone who skipped' },
  { roll:'21EE10023', label:'Someone eating today' },
  { roll:'23CE30019', label:'Someone from another hall' }
];
const TABS = {
  student:[['pass','🎫','Mess pass'],['meals','🍽️','Skip meals'],['month','🗓️','My month']],
  manager:[['cook','🧺','Cooking'],['door','🚪','Door check'],['left','🗑️','Leftovers']],
  gsec:[['overview','📊','Overview'],['waste','♻️','Food waste'],['note','✉️','Note to Warden']]
};

const KEY = 'messskip-demo-v3';
const fresh = () => ({ v:3, role:'student', tab:{ student:'pass', manager:'cook', gsec:'overview' }, skips:{}, rules:[{dow:6,meal:3,from:'2000-01-01'}],
  cutoff:22, buffer:5, remind:true, mgrDay:1, scanMeal:null, scans:[], lastResult:null, leftovers:{} });
function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 3) return Object.assign(fresh(), s); } catch(e){} return fresh(); }
let state = load();
state.tab.student = 'pass';   // the student app always opens on the mess pass
state.lastResult = null;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

/* ---------- helpers ---------- */
const pad = n => String(n).padStart(2,'0');
const dkey = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const hourLabel = h => (h % 12 || 12) + (h < 12 ? ' AM' : ' PM');
const timeLabel = s => { const [h,m] = s.split(':').map(Number); return (h % 12 || 12) + (m ? ':' + pad(m) : '') + (h < 12 ? ' AM' : ' PM'); };
const fmtDate = d => d.getDate()+' '+MON[d.getMonth()];
const toMin = s => { const [a,b] = s.split(':').map(Number); return a*60+b; };
const nowMin = () => { const n = new Date(); return n.getHours()*60 + n.getMinutes(); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kg = x => (Math.round(x*10)/10).toLocaleString('en-IN');
function hash(str){ let h = 2166136261; for (const ch of str){ h ^= ch.charCodeAt(0); h = Math.imul(h,16777619); } return (h>>>0)/4294967295; }
const cutoffFor = date => { const c = addDays(date,-1); c.setHours(state.cutoff,0,0,0); return c; };
const isLocked = date => new Date() >= cutoffFor(date);
const ruleHits = (date,m) => state.rules.some(r => r.dow === date.getDay() && r.meal === m && dkey(date) >= r.from);
function mySkip(date,m){ const k = dkey(date)+'|'+m; if (k in state.skips) return state.skips[k]; return ruleHits(date,m); }
const othersOut = (date,m) => Math.max(0, Math.round((BOARDERS-1) * (RATES[date.getDay()][m] + (hash(dkey(date)+m) - .5) * .06)));
const optOuts = (date,m) => othersOut(date,m) + (mySkip(date,m) ? 1 : 0);
const eaters = (date,m) => BOARDERS - optOuts(date,m);
const perPersonKg = m => QTY[MEALS[m].k].reduce((a,[,p]) => a + p, 0);
const cookFor = n => Math.ceil(n * (1 + state.buffer/100));
function dayLabel(d){ const diff = Math.round((d - today())/86400000); return diff === 0 ? 'Today' : diff === 1 ? 'Tomorrow' : diff === -1 ? 'Yesterday' : DOW_LONG[d.getDay()]; }
function firstOpenDay(){ for (let i = 0; i < 4; i++){ const d = addDays(today(),i); if (!isLocked(d)) return d; } return addDays(today(),2); }
function currentOrNextMeal(){
  const mins = nowMin();
  for (let i = 0; i < 4; i++) if (mins <= toMin(MEALS[i].end)) return { date: today(), m: i, live: mins >= toMin(MEALS[i].start) };
  return { date: addDays(today(),1), m: 0, live: false };
}
function untilText(target){
  const ms = target - new Date(); if (ms <= 0) return 'now';
  const h = Math.floor(ms/3600000), m = Math.floor(ms%3600000/60000);
  return h ? `${h} h ${m} min` : `${m} min`;
}
// Food thrown away (kg) before the pilot: the mess cooked for everyone, so most of the skippers' share was wasted.
const wasteBefore = (dow,m) => RATES[dow][m] * BOARDERS * perPersonKg(m) * 0.85 + 2;
function wasteNow(date,m){ const k = dkey(date)+'|'+m; if (k in state.leftovers) return state.leftovers[k]; return 1.5 + hash('w'+k) * 2.5; }
let toastTimer;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }
async function copyText(text){ try { await navigator.clipboard.writeText(text); toast('Copied to clipboard.'); } catch(e){ toast('Couldn’t copy automatically. Select the text and copy it instead.'); } }

/* ================= STUDENT ================= */
function renderPass(){
  const cm = currentOrNextMeal();
  const meal = MEALS[cm.m];
  const skipped = mySkip(cm.date, cm.m);
  const when = cm.live ? `Valid now, until ${timeLabel(meal.end)}` : `${dayLabel(cm.date)}, ${timeLabel(meal.start)} to ${timeLabel(meal.end)}`;
  const t = today();
  const rows = MEALS.map((ml,m) => {
    const done = nowMin() > toMin(ml.end), s = mySkip(t,m);
    const st = done ? `<span class="st done">Over</span>` : s ? `<span class="st skip">Skipping</span>` : `<span class="st eat">Eating</span>`;
    return `<li><span>${ml.name} <span class="muted small">${timeLabel(ml.start)}</span></span>${st}</li>`;
  }).join('');
  const tm = addDays(t,1);
  const tmSkips = MEALS.filter((_,m) => mySkip(tm,m)).length;
  const tmLocked = isLocked(tm);
  const tmLine = tmLocked
    ? `Tomorrow is locked: eating ${4-tmSkips}, skipping ${tmSkips}.`
    : `Tomorrow: eating ${4-tmSkips}, skipping ${tmSkips}. You can change it for another ${untilText(cutoffFor(tm))}.`;
  return `
  <h1 class="sr">Your mess pass</h1>
  <div class="ticket m-${meal.k} ${skipped ? 'skipped' : ''}">
    <div class="t-head">
      <div class="t-row"><span>Demo Hall mess</span><span class="clock" id="clock"></span></div>
      <div class="t-meal">${meal.name}</div>
      <div class="t-when">${when}</div>
      ${skipped ? '<div class="stamp">Skipped</div>' : ''}
    </div>
    <div class="band" aria-hidden="true"></div>
    <div class="t-body">
      <div class="qr" id="qr" role="img" aria-label="QR code for roll number ${ME.roll}"></div>
      <div class="who"><div class="name">${ME.name}</div><div>${ME.roll}</div><div>Room ${ME.room}</div></div>
    </div>
    <div class="t-foot">${skipped ? 'This pass won’t work for this meal.' : 'Show this at the counter. The moving strip and the clock show it’s live, not a screenshot.'}</div>
  </div>
  ${skipped ? `<div class="note-box no">You skipped ${dayLabel(cm.date).toLowerCase()}’s ${meal.name.toLowerCase()}, so it wasn’t cooked for you. If you’re here anyway, have a word with the mess supervisor.</div>` : ''}
  <h2 style="margin-top:22px">Today</h2>
  <ul class="daylist">${rows}</ul>
  <div class="note-box soft"><div style="margin-bottom:8px">${tmLine}</div>${tmLocked ? '' : '<button type="button" class="btn quiet tiny" data-go-tab="meals">Change tomorrow</button>'}</div>`;
}

function tickClock(){ const c = document.getElementById('clock'); if (!c) return; const n = new Date(); c.textContent = pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds()); }
setInterval(tickClock, 1000);

function renderMeals(){
  const t = today();
  const days = [...Array(7)].map((_,i) => addDays(t,i));
  const board = days.map(d => {
    const lock = isLocked(d), cut = cutoffFor(d);
    const all = MEALS.every((_,m) => mySkip(d,m));
    const meta = lock ? '🔒 Locked' : (dayLabel(cut) === 'Today' ? `Open until ${hourLabel(state.cutoff)} tonight` : `Open until ${hourLabel(state.cutoff)} ${DOW[cut.getDay()]}`);
    const btns = MEALS.map((ml,m) => {
      const s = mySkip(d,m);
      return `<button type="button" class="mbtn ${s?'skip':''} ${lock?'locked':''}" data-d="${dkey(d)}" data-m="${m}" aria-pressed="${s}" aria-label="${DOW_LONG[d.getDay()]} ${ml.name}, ${esc(MENU[d.getDay()][m])}. ${s?'Skipping':'Eating'}${lock?'. Locked':''}">
        <span class="mn">${ml.name}</span><span class="dish">${esc(MENU[d.getDay()][m])}</span><span class="st ${s?'skip':'eat'}">${s?'Skipping':'Eating'}</span></button>`;

    return `<div class="day"><div class="day-h"><div><strong>${dayLabel(d)}, ${fmtDate(d)}</strong><div class="meta">${meta}</div></div>${dayBtn}</div><div class="grid4">${btns}</div></div>`;
  }).join('');
  const rules = state.rules.length
    ? state.rules.map((r,i) => `<li><span>Every ${DOW_LONG[r.dow]}, ${MEALS[r.meal].name.toLowerCase()}</span><button type="button" class="btn quiet tiny" data-remove-rule="${i}">Remove</button></li>`).join('')
    : `<li class="muted">Nothing yet. If you skip the same meal every week, add it here once.</li>`;
  return `
  <section>
    <h1>Skip a meal</h1>
    <p class="muted">The week’s menu is below. Tap anything you won’t eat. Going home for a day? Skip the whole day in one go. Each day stays open until ${hourLabel(state.cutoff)} the night before, so the mess knows how much to cook.</p>
    ${board}
  </section>
  <section>
    <h2>Every week</h2>
    <p class="muted small">Same meal you always skip? Set it once. It starts from the next day that’s still open.</p>
    <div class="row">
      <label class="sr" for="rule-day">Day</label>
      <select id="rule-day">${DOW_LONG.map((d,i) => `<option value="${i}" ${i===2?'selected':''}>${d}</option>`).join('')}</select>
      <label class="sr" for="rule-meal">Meal</label>
      <select id="rule-meal">${MEALS.map((m,i) => `<option value="${i}" ${i===1?'selected':''}>${m.name}</option>`).join('')}</select>
      <button type="button" class="btn" id="add-rule">Add</button>
    </div>
    <ul class="rules">${rules}</ul>
  </section>`;
}

function renderMonth(){
  const t = today();
  const first = new Date(t.getFullYear(), t.getMonth(), 1);
  let done = 0, planned = 0;
  for (let d = first; d <= addDays(t,6) && d.getMonth() === t.getMonth(); d = addDays(d,1))
    for (let m = 0; m < 4; m++) if (mySkip(d,m)) { if (d < t || (dkey(d) === dkey(t) && nowMin() > toMin(MEALS[m].end))) done++; else planned++; }
  const n = done + planned;
  const upcoming = [];
  for (let i = 1; i < 7; i++){ const d = addDays(t,i); for (let m = 0; m < 4; m++) if (mySkip(d,m)) upcoming.push(`${dayLabel(d)} ${MEALS[m].name.toLowerCase()}`); }
  const remindAt = hourLabel(state.cutoff - 1);
  return `
  <section>
    <h1>${MON_LONG[t.getMonth()]} so far</h1>
    <div class="big">${n}</div>
    <p class="muted">${n === 1 ? 'meal' : 'meals'} skipped this month: ${done} already gone, ${planned} planned.</p>
  </section>
  <section>
    <h2>Coming up</h2>
    <p>${upcoming.length ? upcoming.map(esc).join(', ') + '.' : 'No skips planned for the next six days.'}</p>
  </section>
  <section>
    <div class="switch">
      <div><strong>Evening reminder</strong><div class="muted small">A nudge at ${remindAt}, an hour before skips close, so you don’t forget tomorrow.</div></div>
      <button type="button" class="toggle" role="switch" aria-checked="${state.remind}" aria-label="Evening reminder" id="remind"></button>
    </div>
  </section>
  <section class="aside">
    <strong>What about refunds?</strong>
    <p style="margin:6px 0 0">Not yet. For now, your skips tell the mess how much to cook, so less food gets thrown out. After a semester of this data, the mess committee will take it to the Warden and HMC and ask for rebates. If they agree to around ₹${RATE_PER_MEAL} a meal, this month would be worth about ₹${n * RATE_PER_MEAL} to you.</p>
  </section>`;
}

function renderCook(){
  const t = today();
  const d = addDays(t, state.mgrDay);
  const lock = isLocked(d), cut = cutoffFor(d);
  const status = lock
    ? `<span class="status final">Final</span>Skips closed at ${hourLabel(state.cutoff)} on ${DOW[cut.getDay()]} ${fmtDate(cut)}. These numbers won’t change.`
    : `<span class="status open">Still open</span>Students can skip until ${hourLabel(state.cutoff)} on ${DOW[cut.getDay()]} ${fmtDate(cut)}, so these numbers may still drop.`;
  let saved = 0;
  const rows = MEALS.map((ml,m) => {
    const n = eaters(d,m), out = optOuts(d,m), c = cookFor(n);
    saved += perPersonKg(m) * (BOARDERS - c);
    const order = QTY[ml.k].map(([nm,p,u]) => `${nm} ${kg(p*c)} ${u}`).join(', ');
    return `<tr><td><span class="mealdot" style="background:var(${MEAL_VAR[m]})"></span><strong>${ml.name}</strong><div class="order">${esc(MENU[d.getDay()][m])}</div></td>
      <td class="num"><span class="eatn">${n}</span></td><td class="num">${out}</td><td class="num">${c}</td><td class="order">${order}</td></tr>`;
  }).join('');
  const glance = [...Array(7)].map((_,i) => { const x = addDays(t,i); return `<tr><td>${dayLabel(x)}${i>1?'':''}, ${fmtDate(x)}</td>${MEALS.map((_,m) => { const n = eaters(x,m); return `<td class="${n < BOARDERS*.72 ? 'low' : ''}">${n}</td>`; }).join('')}</tr>`; }).join('');
  const dayName = state.mgrDay === 0 ? 'today' : state.mgrDay === 1 ? 'tomorrow' : DOW_LONG[d.getDay()];
  return `
  <section>
    <h1>Cook for ${cookFor(eaters(d,3))} at dinner ${dayName}, not ${BOARDERS}.</h1>
    <p class="muted">Counts come from students who skipped in the app, plus a small safety buffer. Order for the people who’ll actually eat.</p>
    <div class="row" style="justify-content:space-between;margin:14px 0 10px">
      <div class="chips" role="group" aria-label="Pick a day">
        ${[0,1,2,3].map(i => { const x = addDays(t,i); return `<button type="button" class="chip" data-mgr-day="${i}" aria-pressed="${state.mgrDay===i}">${i===0?'Today':i===1?'Tomorrow':DOW[x.getDay()]+' '+x.getDate()}</button>`; }).join('')}
      </div>
      <div class="row small">
        <label for="buffer" class="muted">Buffer</label>
        <select id="buffer">${[0,3,5,10].map(b => `<option value="${b}" ${b===state.buffer?'selected':''}>${b === 0 ? 'None' : '+' + b + '%'}</option>`).join('')}</select>
        <label for="cutoff" class="muted">Skips close at</label>
        <select id="cutoff">${[19,20,21,22,23].map(h => `<option value="${h}" ${h===state.cutoff?'selected':''}>${hourLabel(h)}, night before</option>`).join('')}</select>
      </div>
    </div>
    <p class="small">${status}</p>
    <div class="tablewrap"><table class="cook">
      <thead><tr><th>Meal</th><th class="num">Eating</th><th class="num">Skipped</th><th class="num">Cook for</th><th>Suggested order</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="row" style="justify-content:space-between;margin-top:12px">
      <p class="small" style="margin:0">That’s about <strong>${Math.round(saved)} kg</strong> less raw material than cooking for all ${BOARDERS}.</p>
      <button type="button" class="btn quiet" id="copy-order">Copy order list</button>
    </div>
  </section>
  <section>
    <h2>The week ahead</h2>
    <p class="muted small">Students eating each meal, for planning weekly stock. Highlighted meals have under 72% turnout.</p>
    <div class="tablewrap"><table class="glance"><thead><tr><th>Day</th>${MEALS.map(m => `<th>${m.name}</th>`).join('')}</tr></thead><tbody>${glance}</tbody></table></div>
    <p class="muted small" style="margin-top:8px">Days further out will drop as more students plan their skips.</p>
  </section>`;
}
function inSoFar(m){
  const ml = MEALS[m], now = nowMin(), s = toMin(ml.start), e = toMin(ml.end), exp = eaters(today(),m);
  let base = now < s ? 0 : now > e ? exp - 2 - Math.round(hash(dkey(today())+'x'+m)*5) : Math.round(exp * (now - s) / (e - s) * .95);
  const mine = state.scans.filter(x => x.type === 'ok' && x.m === m && x.day === dkey(today())).length;
  return Math.max(0, base) + mine;
}

  return `${corners}<div class="msg">Point the camera at a student’s mess pass.<br><button type="button" class="btn" id="cam-start">Start camera</button></div>`;
}

/* Camera scanning */
const cam = { mode:'idle', stream:null, raf:0, last:'', lastAt:0, flash:null, reading:false, note:'' };
let detector = null;
async function startCamera(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toDemo('This browser can’t open the camera here, so this is a preview of how scanning looks.'); return; }
  cam.mode = 'starting'; refreshViewfinder();
  try {
    cam.stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' }, audio:false });
    if ('BarcodeDetector' in window){ try { detector = new BarcodeDetector({ formats:['qr_code'] }); } catch(e){ detector = null; } }
    cam.mode = 'live'; refreshViewfinder(); attachVideo(); scanLoop();
  } catch(e){
    toDemo(e && e.name === 'NotAllowedError' ? 'Camera permission was blocked, so this is a preview of how scanning looks.' : 'The camera isn’t available on this page, so this is a preview of how scanning looks.');
  }
}
function toDemo(note){ stopCamera(); cam.mode = 'demo'; cam.note = note; refreshViewfinder(); }
function stopCamera(){
  cancelAnimationFrame(cam.raf);
  if (cam.stream){ cam.stream.getTracks().forEach(t => t.stop()); cam.stream = null; }
  if (cam.mode === 'live' || cam.mode === 'starting') cam.mode = 'idle';
}
function attachVideo(){ const v = document.getElementById('cam-video'); if (v && cam.stream && v.srcObject !== cam.stream){ v.srcObject = cam.stream; v.play().catch(() => {}); } }
const work = document.createElement('canvas');
async function scanLoop(){
  if (cam.mode !== 'live') return;
  const v = document.getElementById('cam-video');
  if (v && v.readyState >= 2 && v.videoWidth){
    let text = null;
    try {
      if (detector){ const codes = await detector.detect(v); if (codes.length) text = codes[0].rawValue; }
      else if (window.jsQR){
        const w = 480, h = Math.round(v.videoHeight / v.videoWidth * w);
        work.width = w; work.height = h;
        const ctx = work.getContext('2d', { willReadFrequently:true });
        ctx.drawImage(v, 0, 0, w, h);
        const code = jsQR(ctx.getImageData(0,0,w,h).data, w, h, { inversionAttempts:'dontInvert' });
        if (code) text = code.data;
      }
    } catch(e){}
    if (text){
      const roll = text.startsWith('MESSSKIP|') ? text.split('|')[1] : text;
      const now = Date.now();
      if (roll !== cam.last || now - cam.lastAt > 4000){ cam.last = roll; cam.lastAt = now; runScan(roll, true); }
    }
  }
  cam.raf = requestAnimationFrame(scanLoop);
}
function refreshViewfinder(){
  const vf = document.getElementById('viewfinder'); if (!vf) return;
  vf.className = 'viewfinder' + (cam.flash ? ' flash-' + cam.flash : '') + (cam.reading ? ' reading' : '');
  vf.innerHTML = viewfinderInner();
  if (cam.mode === 'live') attachVideo();
}
function simulateScan(roll){
  if (cam.mode !== 'live' && cam.mode !== 'demo'){ cam.mode = 'demo'; cam.note = 'Preview: this is what the camera sees while it reads a pass.'; }
  cam.reading = true; refreshViewfinder();
  setTimeout(() => { cam.reading = false; runScan(roll, true); }, 650);
}
function checkEntry(raw, m){
  const roll = String(raw).trim().toUpperCase();
  const meal = MEALS[m].name.toLowerCase();
  if (!/^\d{2}[A-Z]{2}\d{5}$/.test(roll)) return { cls:'warn', title:'That doesn’t look like a roll number', msg:'Roll numbers look like 22ME30041. Try scanning again.', roll: roll || 'Blank' };
  if (!HALL_ROLLS.has(roll)) return { cls:'no', title:'Not from this hall', msg:`${roll} isn’t on this hall’s mess list. They’ll need to eat in their own hall.`, roll, type:'outsider' };
  const out = roll === ME.roll ? mySkip(today(), m) : roll === '22CS10077';
  if (out) return { cls:'no', title:'Skipped this meal', msg:`${roll} skipped today’s ${meal}, so it wasn’t cooked for them.`, roll, type:'optout' };
  if (state.scans.some(s => s.roll === roll && s.m === m && s.day === dkey(today()) && s.type === 'ok')) return { cls:'warn', title:'Already in', msg:`${roll} has already been checked in for ${meal} today.`, roll, type:'repeat' };
  return { cls:'ok', title:'Good to go', msg:`${roll} can have today’s ${meal}.`, roll, type:'ok' };
}
function runScan(roll, fromCamera){
  const sel = document.getElementById('scan-meal');
  const m = sel ? Number(sel.value) : (state.scanMeal ?? currentOrNextMeal().m);
  state.scanMeal = m;
  const r = checkEntry(roll, m);
  state.lastResult = r;
  state.scans.unshift({ roll:r.roll, m, day:dkey(today()), cls:r.cls, title:r.title, type:r.type || 'invalid' });
  state.scans = state.scans.slice(0,40);
  cam.flash = r.cls === 'ok' ? 'ok' : r.cls === 'no' ? 'no' : null;
  save(); render();
  if (navigator.vibrate) { try { navigator.vibrate(r.cls === 'ok' ? 60 : [80,60,80]); } catch(e){} }
  clearTimeout(cam.flashTimer); cam.flashTimer = setTimeout(() => { cam.flash = null; refreshViewfinder(); }, 1200);
  if (!fromCamera){ const f = document.getElementById('roll'); if (f) f.focus(); }
}
function renderLeft(){
  const t = today(), y = addDays(t,-1);
  const slots = [];
  [t,y].forEach(d => MEALS.forEach((ml,m) => { if (d < t || nowMin() > toMin(ml.end)) slots.push({ d, m }); }));
  const rows = slots.map(({d,m}) => {
    const k = dkey(d)+'|'+m;
    const val = k in state.leftovers ? state.leftovers[k] : '';
    return `<div class="leftrow"><div class="lbl"><strong>${dayLabel(d)}’s ${MEALS[m].name.toLowerCase()}</strong><div class="muted small">${esc(MENU[d.getDay()][m])}. Before MessSkip, this meal usually left about ${Math.round(wasteBefore(d.getDay(),m))} kg.</div></div>
      <div class="row"><label class="sr" for="lo-${k}">Kilograms thrown away</label><input type="number" min="0" step="0.5" inputmode="decimal" id="lo-${k}" data-left="${k}" value="${val}" placeholder="kg"><span class="muted small">kg</span></div></div>`;
  }).join('');
  return `
  <section>
    <h1>What got thrown away?</h1>
    <p class="muted">After each meal, weigh what’s left in the bins and note it here. It takes ten seconds, and it’s the number that shows the Warden whether this is working.</p>
    ${rows || '<p class="muted">No meals have finished yet today. Come back after breakfast.</p>'}
  </section>`;
}

/* ================= GSEC AND AUDITOR ================= */
function weekNumbers(){
  const t = today();
  let skipped = 0, kgSaved = 0, before = 0, now = 0;
  for (let i = 6; i >= 0; i--){ const d = addDays(t,-i); for (let m = 0; m < 4; m++){ const o = optOuts(d,m); skipped += o; kgSaved += o * perPersonKg(m); before += wasteBefore(d.getDay(),m); now += wasteNow(d,m); } }
  return { skipped, kgSaved, before, now };
}
function renderOverview(){
  const w = weekNumbers();
  const users = 497;
  const stopped = 6 + state.scans.filter(s => s.type === 'optout' || s.type === 'outsider').length;
  const order = [1,2,3,4,5,6,0];
  const avg = order.map(i => ({ i, pct: Math.round(RATES[i].reduce((a,b) => a+b, 0) / 4 * 100) }));
  const max = Math.max(...avg.map(a => a.pct));
  const bars = avg.map(a => `<div class="bar ${a.i===2||a.i===6?'hot':''}"><span>${DOW[a.i]}</span><div class="track"><div class="fill" style="width:${Math.round(a.pct/max*100)}%"></div></div><span class="pct">${a.pct}%</span></div>`).join('');
  const weeks = accuracyWeeks();
  const rows = weeks.map(x => `<tr><td>Week ${x.w}</td><td>${x.p}</td><td>${x.a}</td><td>${x.acc.toFixed(1)}%</td></tr>`).join('');
  const adopt = [303,393,452,users];
  const adoptRows = adopt.map((u,i) => `<div class="bar"><span>Wk ${i+1}</span><div class="track"><div class="fill" style="width:${Math.round(u/BOARDERS*100)}%;background:var(--ok)"></div></div><span class="pct">${Math.round(u/BOARDERS*100)}%</span></div>`).join('');
  return `
  <section>
    <h1>Saturday dinner is the meal people skip most. About ${Math.round(RATES[6][3]*100)}% of the hall opts out.</h1>
    <p class="muted">What the mess committee can take to the Warden and HMC: who skips, when, and how much less the mess now cooks and throws away.</p>
  </section>
  <div class="stats">
    <div><div class="v">${users} of ${BOARDERS}</div><div class="l">boarders used the app this week</div></div>
    <div><div class="v">${w.skipped.toLocaleString('en-IN')}</div><div class="l">meals not cooked in the last 7 days</div></div>
    <div><div class="v">${Math.round(w.before - w.now)} kg</div><div class="l">less food thrown away than a typical week before the pilot</div></div>
    <div><div class="v">${stopped}</div><div class="l">people stopped at the door this week</div></div>
  </div>
  <div class="split">
    <section>
      <h2>Who skips, by day</h2>
      <p class="muted small">Share of boarders skipping, averaged across the four meals.</p>
      <div class="bars">${bars}</div>
    </section>
    <section>
      <h2>Are people actually using it?</h2>
      <p class="muted small">Share of boarders who opened the app each week of the pilot.</p>
      <div class="bars">${adoptRows}</div>
    </section>
  </div>
  <section>
    <h2>Can the mess trust the numbers?</h2>
    <p class="muted small">Average students per meal, predicted from skips and counted at the door.</p>
    <div style="overflow-x:auto"><table class="data"><thead><tr><th>Week</th><th>Predicted</th><th>Counted</th><th>Accuracy</th></tr></thead><tbody>${rows}</tbody></table></div>
  </section>`;
}
function accuracyWeeks(){ return [1,2,3,4].map(w => { const p = Math.round(BOARDERS*.84 + (hash('p'+w)-.5)*10); const a = Math.round(p - 2 - hash('a'+w)*9); return { w, p, a, acc: 100 - Math.abs(p-a)/a*100 }; }); }
function renderWaste(){
  const t = today();
  const days = [...Array(7)].map((_,i) => addDays(t,i-6));
  const vals = days.map(d => ({ d, before: MEALS.reduce((s,_,m) => s + wasteBefore(d.getDay(),m), 0), now: MEALS.reduce((s,_,m) => s + wasteNow(d,m), 0) }));
  const max = Math.max(...vals.map(v => v.before));
  const pairs = vals.map(v => `<div class="pair"><span style="grid-row:span 2;font-weight:${[2,6].includes(v.d.getDay())?700:500}">${DOW[v.d.getDay()]}</span>
    <div class="track"><div class="fill before" style="width:${Math.round(v.before/max*100)}%"></div></div><span class="pct muted">${Math.round(v.before)} kg</span>
    <div class="track"><div class="fill now" style="width:${Math.round(v.now/max*100)}%"></div></div><span class="pct">${Math.round(v.now)} kg</span></div>`).join('');
  const slots = [];
  for (let d = 0; d < 7; d++) for (let m = 0; m < 4; m++) slots.push({ d, m, r: RATES[d][m] });
  slots.sort((a,b) => b.r - a.r);
  const top = slots.slice(0,6).map(s => `<li><span><strong>${DOW_LONG[s.d]} ${MEALS[s.m].name.toLowerCase()}</strong><span class="dish">${esc(MENU[s.d][s.m])}</span></span><span class="pct">${Math.round(s.r*100)}%</span></li>`).join('');
  const logged = Object.keys(state.leftovers).length;
  return `
  <section>
    <h1>Food thrown away, before and after</h1>
    <p class="muted">Each day of the last week, compared with a typical day before MessSkip, when the mess cooked for all ${BOARDERS} boarders.</p>
    <div class="legend"><span><i style="background:var(--grey)"></i>Before the pilot</span><span><i style="background:var(--ok)"></i>Last 7 days</span></div>
    <div class="bars">${pairs}</div>
    <p class="muted small" style="margin-top:10px">${logged ? `Includes ${logged} ${logged === 1 ? 'reading' : 'readings'} logged by mess staff in this demo.` : 'Mess staff log these from the Leftovers tab after each meal.'}</p>
  </section>
  <section>
    <h2>What students skip most</h2>
    <p class="muted small">Useful for the menu in the next GBM. A meal people keep skipping might just need changing.</p>
    <ul class="ranked">${top}</ul>
  </section>`;
}
function renderNote(){
  const w = weekNumbers();
  const users = 497;
  const order = [1,2,3,4,5,6,0];
  const avg = order.map(i => ({ i, pct: Math.round(RATES[i].reduce((a,b) => a+b, 0) / 4 * 100) }));
  const sat = avg.find(a => a.i===6).pct, tue = avg.find(a => a.i===2).pct;
  const rest = Math.round(avg.filter(a => a.i!==6 && a.i!==2).reduce((s,a) => s + a.pct, 0) / 5);
  const acc = accuracyWeeks(); const accAvg = acc.reduce((s,x) => s + x.acc, 0) / acc.length;
  const letter = `Respected Sir/Ma’am,

Over the last seven days, students skipped ${w.skipped.toLocaleString('en-IN')} meals in advance through MessSkip. That’s roughly ${Math.round(w.kgSaved)} kg of raw material the mess didn’t need to buy or cook, and food thrown away has dropped from about ${Math.round(w.before)} kg to ${Math.round(w.now)} kg a week.

Saturday and Tuesday stand out. On average ${sat}% and ${tue}% of boarders skip meals on those days, against about ${rest}% on other days.

${users} of our ${BOARDERS} boarders used the app this week, and the predicted headcount was within ${(100-accAvg).toFixed(1)}% of what we counted at the door.

Based on this, we’d like to request a meeting to discuss refunding meals that students skip before the cutoff.

Mess GSec and Mess Auditor`;
  return `
  <section>
    <h1>Note to the Warden</h1>
    <p class="muted">Drafted from this week’s numbers. Read it through and edit it before sending.</p>
    <div class="letter" id="letter">${esc(letter)}</div>
    <div class="row" style="margin-top:12px"><button type="button" class="btn" id="copy-letter">Copy note</button></div>
  </section>`;
}

/* ================= SHELL ================= */
const about = () => `<details class="about">
  <summary>About this prototype</summary>
  <ul>
    <li>A working demo for one hall. Anything you change is saved only in this browser, so each visitor gets their own copy.</li>
    <li>Everyone else’s skips, door counts, and past waste are simulated, following what students and mess staff told me: Saturday and Tuesday have the lowest turnout and the most leftovers.</li>
    <li>Still to confirm with the mess manager: the ${hourLabel(state.cutoff)} cutoff, about ₹${RATE_PER_MEAL} of raw material per meal, and the per-person quantities in the order list.</li>
    <li>Phase 1 has no refunds and no ERP link. Both come later.</li>
  </ul>
  <button type="button" class="linkbtn" id="reset">Reset the demo</button>
</details>`;

function render(){
  document.querySelectorAll('.roles button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.role === state.role)));
  const role = state.role, tab = state.tab[role];
  document.getElementById('tabs-in').innerHTML = TABS[role].map(([id,ic,lbl]) => `<button type="button" data-tab="${id}" ${id===tab?'aria-current="page"':''}><span class="ic" aria-hidden="true">${ic}</span><span class="lbl">${lbl}</span></button>`).join('');
  document.getElementById('tabs').setAttribute('aria-label', role === 'student' ? 'Student app' : role === 'manager' ? 'Mess staff app' : 'GSec and auditor app');
  const app = document.getElementById('app');
  const views = {
    student:{ pass:renderPass, meals:renderMeals, month:renderMonth },
    manager:{ cook:renderCook, door:renderDoor, left:renderLeft },
    gsec:{ overview:renderOverview, waste:renderWaste, note:renderNote }
  };
  app.className = role === 'student' || (role === 'manager' && tab !== 'cook') ? 'phone' : 'wide';
  app.innerHTML = views[role][tab]() + about();
  if (role === 'student' && tab === 'pass') afterPass();
  if (!(role === 'manager' && tab === 'door')){ if (cam.stream || cam.mode !== 'idle'){ stopCamera(); cam.mode = 'idle'; } }
  else if (cam.mode === 'live') attachVideo();
}

const THEME_KEY = 'messskip-theme';
const sysDark = () => window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
function currentTheme(){ return document.documentElement.dataset.theme || (sysDark() ? 'dark' : 'light'); }
function applyTheme(t){
  if (t) document.documentElement.dataset.theme = t;
  const b = document.getElementById('theme'); const dark = currentTheme() === 'dark';
  b.textContent = dark ? '☀️ Light' : '🌙 Dark';
  b.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
}
try { applyTheme(localStorage.getItem(THEME_KEY)); } catch(e){ applyTheme(null); }
document.getElementById('theme').addEventListener('click', () => {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  applyTheme(next); try { localStorage.setItem(THEME_KEY, next); } catch(e){}
  render();
});
document.querySelector('.roles').addEventListener('click', e => {
  const b = e.target.closest('[data-role]'); if (!b) return;
  state.role = b.dataset.role; if (state.role === 'student') state.tab.student = 'pass';
  state.lastResult = null; save(); render(); window.scrollTo(0,0);
});
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  state.tab[state.role] = b.dataset.tab; state.lastResult = null; save(); render(); window.scrollTo(0,0);
});
function freezeLocked(rule){
  // keep already-locked days as they were when a weekly skip is removed
  const t = today();
  for (let d = new Date(t.getFullYear(), t.getMonth(), 1); d <= addDays(t,7); d = addDays(d,1)){
    const k = dkey(d)+'|'+rule.meal;
    if (isLocked(d) && d.getDay() === rule.dow && dkey(d) >= rule.from && !(k in state.skips)) state.skips[k] = true;
  }
}
document.getElementById('app').addEventListener('click', e => {
  const go = e.target.closest('[data-go-tab]');
  if (go){ state.tab.student = go.dataset.goTab; save(); render(); window.scrollTo(0,0); return; }
  const mb = e.target.closest('.mbtn');
  if (mb){
    const d = fromKey(mb.dataset.d), m = Number(mb.dataset.m);
    if (isLocked(d)){ toast(`Too late to change ${dayLabel(d).toLowerCase()}. It closed at ${hourLabel(state.cutoff)} the night before.`); return; }
    const k = mb.dataset.d + '|' + m;
    state.skips[k] = !mySkip(d,m);
    save(); render();
    toast(state.skips[k] ? `Skipping ${dayLabel(d).toLowerCase()}’s ${MEALS[m].name.toLowerCase()}.` : `Back in for ${dayLabel(d).toLowerCase()}’s ${MEALS[m].name.toLowerCase()}.`);
    const again = document.querySelector(`.mbtn[data-d="${mb.dataset.d}"][data-m="${m}"]`); if (again) again.focus();
    return;
  }
  const sd = e.target.closest('[data-skipday]');
  if (sd){
    const d = fromKey(sd.dataset.skipday);
    if (isLocked(d)) return;
    const all = MEALS.every((_,m) => mySkip(d,m));
    MEALS.forEach((_,m) => state.skips[sd.dataset.skipday+'|'+m] = !all);
    save(); render(); toast(all ? `You’re eating all of ${dayLabel(d).toLowerCase()}’s meals.` : `Skipping all of ${dayLabel(d).toLowerCase()}. Safe trip.`);
    return;
  }
  if (e.target.id === 'add-rule'){
    const dow = Number(document.getElementById('rule-day').value), meal = Number(document.getElementById('rule-meal').value);
    if (state.rules.some(r => r.dow === dow && r.meal === meal)){ toast('You’ve already got that one.'); return; }
    state.rules.push({ dow, meal, from: dkey(firstOpenDay()) });
    save(); render(); toast(`Done. You’ll skip ${MEALS[meal].name.toLowerCase()} every ${DOW_LONG[dow]}.`); return;
  }
  const rm = e.target.closest('[data-remove-rule]');
  if (rm){ const r = state.rules[Number(rm.dataset.removeRule)]; freezeLocked(r); state.rules.splice(Number(rm.dataset.removeRule),1); save(); render(); toast(`Removed ${DOW_LONG[r.dow]} ${MEALS[r.meal].name.toLowerCase()}. Locked days stay as they were.`); return; }
  if (e.target.id === 'remind'){ state.remind = !state.remind; save(); render(); toast(state.remind ? `Reminder on for ${hourLabel(state.cutoff-1)}.` : 'Reminder off.'); return; }
  const chip = e.target.closest('[data-mgr-day]');
  if (chip){ state.mgrDay = Number(chip.dataset.mgrDay); save(); render(); return; }
  const sample = e.target.closest('[data-sample]');
  if (sample){ simulateScan(sample.dataset.sample); return; }
  if (e.target.id === 'cam-start'){ startCamera(); return; }
  if (e.target.id === 'cam-stop'){ stopCamera(); refreshViewfinder(); return; }
  if (e.target.id === 'scan-btn'){ runScan(document.getElementById('roll').value); return; }
  if (e.target.id === 'copy-order'){
    const d = addDays(today(), state.mgrDay);
    const lines = [`Order for ${DOW_LONG[d.getDay()]} ${fmtDate(d)} (buffer ${state.buffer}%)`];
    MEALS.forEach((ml,m) => { const c = cookFor(eaters(d,m)); lines.push(`${ml.name}: cook for ${c}. ` + QTY[ml.k].map(([nm,p,u]) => `${nm} ${kg(p*c)} ${u}`).join(', ')); });
    copyText(lines.join('\n')); return;
  }
  if (e.target.id === 'copy-letter'){ copyText(document.getElementById('letter').textContent); return; }
  if (e.target.id === 'reset'){ const role = state.role; state = fresh(); state.role = role; save(); render(); toast('Demo reset.'); }
});
document.getElementById('app').addEventListener('change', e => {
  if (e.target.id === 'cutoff'){ state.cutoff = Number(e.target.value); save(); render(); toast(`Skips now close at ${hourLabel(state.cutoff)} the night before.`); }
  if (e.target.id === 'buffer'){ state.buffer = Number(e.target.value); save(); render(); toast(state.buffer ? `Cooking ${state.buffer}% extra as a buffer.` : 'No buffer. Cooking exactly for the count.'); }
  if (e.target.id === 'scan-meal'){ state.scanMeal = Number(e.target.value); state.lastResult = null; save(); render(); }
  if (e.target.dataset && e.target.dataset.left){
    const v = e.target.value.trim();
    if (v === '') delete state.leftovers[e.target.dataset.left];
    else { const n = Number(v); if (isNaN(n) || n < 0){ toast('Enter a weight in kilograms, like 4.5.'); return; } state.leftovers[e.target.dataset.left] = n; }
    save(); toast('Saved.');
  }
});
document.getElementById('app').addEventListener('keydown', e => {
  if (e.target.id === 'roll' && e.key === 'Enter'){ e.preventDefault(); runScan(e.target.value); }
});
render();
</script>
</body>
</html>
